name: patient-management

services:
  mysql:
    image: pmd-mysql:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-pmd}
      MYSQL_USER: ${DATABASE_USER:-pmd_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  backend:
    image: pmd-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-pmd}
      DATABASE_USER: ${DATABASE_USER:-pmd_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/patients').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *logging

  frontend:
    image: pmd-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-31010}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/patients']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

volumes:
  mysql-data:
